name: Deploy Pricefly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricefly-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Configure VPS_SSH_KEY'; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo 'Configure VPS_KNOWN_HOSTS'; exit 1; }
          test -n "$VPS_HOST" || { echo 'Configure VPS_HOST'; exit 1; }
          test -n "$VPS_USER" || { echo 'Configure VPS_USER'; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/pricefly_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/pricefly_deploy" "$HOME/.ssh/known_hosts"
      - name: Build and deploy exact commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/pricefly_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$VPS_USER@$VPS_HOST" "sudo -n /usr/local/bin/deploy-pricefly $DEPLOY_SHA"
      - name: Verify public HTTPS
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://pricefly.shop/ -o /dev/null
